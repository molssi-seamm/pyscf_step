# How to run PySCF for the PySCF step.
#
# PySCF lives in its own Python environment, which pyscf-step-installer creates
# (conda environment 'seamm-pyscf', PySCF from PyPI, for the CPU). Each section is
# for one executor ('local' runs on this machine).

[local]
# The type of installation. Options are:
#     conda: the Conda environment below, which pyscf-step-installer creates
#     local: 'code' is the full path to the Python of an environment you made

installation = conda

# For a conda installation, the conda executable and the environment.

conda = 
conda-environment = seamm-pyscf

# The Python that runs the step's driver script: 'python' in the Conda
# environment, or e.g. /home/me/envs/pyscf/bin/python for a local one.

code = python

# Whether GPU4PySCF is installed too (Linux with an NVIDIA GPU). The relativistic
# calculations always run on the CPU.

gpu = no
